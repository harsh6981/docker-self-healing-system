# Automated Docker Container Health Checks and Self-Healing System
#
#   web  (port 5000)  Sample Flask app A  -+
#   web2 (port 5001)  Sample Flask app B  -+-- watched by --> monitor (port 8080 dashboard)
#
# Both apps use `restart: unless-stopped` (Docker restarts crashed processes).
# The monitor adds what Docker does NOT do: restarting *unhealthy* containers.

x-app: &app
  build:
    context: .
    dockerfile: app/Dockerfile
  image: self-healing-app:latest
  restart: unless-stopped
  init: true                       # tiny init process: forwards signals, reaps zombies
  labels:
    selfheal.monitor: "true"       # the monitor only touches containers with this label

services:
  web:
    <<: *app
    container_name: sh-web
    ports:
      - "5000:5000"
    environment:
      APP_NAME: "Service A"

  web2:
    <<: *app
    container_name: sh-web2
    ports:
      - "5001:5000"
    environment:
      APP_NAME: "Service B"

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    image: self-healing-monitor:latest
    container_name: sh-monitor
    restart: unless-stopped
    init: true
    depends_on:
      - web
      - web2
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets the monitor talk to Docker
      - ./logs:/logs                                # persistent logs on your computer
    environment:
      POLL_INTERVAL: "3"            # seconds between checks
      UNHEALTHY_POLLS: "2"          # consecutive unhealthy polls before restart
      COOLDOWN_SECONDS: "20"        # min seconds between two recovery attempts
      MAX_RESTARTS: "3"             # attempts allowed ...
      WINDOW_SECONDS: "120"         # ... inside this sliding window (restart-loop guard)
      STOPPED_GRACE_SECONDS: "10"   # let Docker's restart policy act first
      CIRCUIT_RESET_SECONDS: "300"  # auto-resume after this long if recovery was paused
      APP_PORT: "5000"
      LOG_DIR: "/logs"
