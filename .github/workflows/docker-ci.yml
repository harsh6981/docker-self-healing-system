# CI pipeline. It tests and validates the CODE on GitHub's cloud runners.
# It does NOT monitor your local Docker containers: runtime monitoring is done
# by the `monitor` container from docker-compose.yml on your own machine.
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Validate, test, build, integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 3. Install dependencies
        run: pip install -r requirements.txt

      - name: 4. Validate Python code (syntax and obvious errors)
        run: |
          python -m compileall -q app monitor tests scripts
          flake8 app monitor tests scripts --select=E9,F63,F7,F82,F401 --show-source

      - name: 5. Run unit tests
        run: python -m pytest -v

      - name: 6. Build Docker images
        run: |
          docker build -f app/Dockerfile -t self-healing-app:ci .
          docker build -f monitor/Dockerfile -t self-healing-monitor:ci .

      - name: 7. Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: 8. Integration test (start stack, inject failures, verify self-healing)
        run: python scripts/integration_test.py --down

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Upload recovery logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-logs
          path: logs/
          if-no-files-found: ignore

      - name: 9. Report result
        if: always()
        run: |
          echo "### Docker CI: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f logs/recovery.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Recovery log produced by the integration test:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 logs/recovery.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
